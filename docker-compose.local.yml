services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bluehouse
      POSTGRES_USER: bluehouse
      POSTGRES_PASSWORD: bluehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluehouse -d bluehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  bluehouse-poller:
    image: bluehouse-poller:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bluehouse:bluehouse@postgres:5432/bluehouse
    command: sleep infinity

volumes:
  postgres_data:
