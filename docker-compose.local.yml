services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bluehouse
      POSTGRES_USER: bluehouse
      POSTGRES_PASSWORD: bluehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluehouse -d bluehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
